<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Extra</title>
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    <style>
        :root {
            --page-bg: #f5f5f7;
            --surface: #ffffff;
            --text: #1f1f23;
            --muted: #6b6b73;
            --border: #e5e5ea;
            --accent: rgb(124, 58, 237);
            --accent-hover: rgb(109, 50, 209);
            --radius: 12px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 24px rgba(0, 0, 0, 0.12), 0 4px 10px rgba(0, 0, 0, 0.06);
            --transition: 0.25s ease;
        }

        * { box-sizing: border-box; }

        html { font-size: 16px; }

        body {
            margin: 0;
            background: var(--page-bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        [v-cloak] { display: none; }

        /* ============================================
           Header
           ============================================ */
        .site-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.85);
        }

        .site-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: url('/images/avatar.jpeg') center/cover;
            display: inline-block;
            border: 2px solid var(--border);
            transition: transform var(--transition);
        }

        .site-header .avatar:hover { transform: rotate(180deg); }

        .site-header .nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            transition: color var(--transition), background var(--transition);
        }

        .site-header .nav-link:hover {
            color: var(--accent);
            background: rgba(124, 58, 237, 0.08);
        }

        /* ============================================
           Hero
           ============================================ */
        .hero {
            text-align: center;
            padding: 4rem 1.5rem 3rem;
            max-width: 720px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 0.75rem;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }

        .hero h1 .accent { color: var(--accent); }

        .hero .subtitle {
            color: var(--muted);
            font-size: 1rem;
            margin: 0 0 0.5rem;
        }

        .hero .meta {
            color: var(--muted);
            font-size: 0.85rem;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            letter-spacing: 0.05em;
        }

        /* ============================================
           Project Grid
           ============================================ */
        .projects {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
        }

        .projects .grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 1.5rem;
        }

        @media (min-width: 640px) {
            .projects .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (min-width: 1024px) {
            .projects .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (min-width: 1440px) {
            .projects .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }

        /* ============================================
           Project Card
           ============================================ */
        .project-card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition), box-shadow var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .project-image {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #f0f0f3;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .project-card:hover .project-image img { transform: scale(1.05); }

        .project-image .overlay {
            position: absolute;
            inset: 0;
            background: rgba(31, 31, 35, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            opacity: 0;
            transition: opacity var(--transition);
            padding: 1rem;
        }

        .project-card:hover .project-image .overlay,
        .project-card:focus-within .project-image .overlay { opacity: 1; }

        .overlay-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 0.9rem;
            background: var(--surface);
            color: var(--text);
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background var(--transition), color var(--transition);
        }

        .overlay-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .overlay-btn svg { width: 16px; height: 16px; }

        .project-badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            letter-spacing: 0.02em;
            z-index: 2;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.3);
        }

        .project-body {
            padding: 1rem 1.1rem 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .project-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
        }

        .project-title a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition);
        }

        .project-title a:hover { color: var(--accent); }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .project-tags li {
            font-size: 0.72rem;
            color: var(--accent);
            background: rgba(124, 58, 237, 0.1);
            padding: 0.15rem 0.55rem;
            border-radius: 4px;
            font-weight: 500;
        }

        .project-desc {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-actions {
            margin-top: auto;
            padding-top: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .demo-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: color var(--transition);
        }

        .demo-link:hover { color: var(--accent-hover); }

        .mobile-actions {
            display: flex;
            gap: 0.5rem;
        }

        .mobile-actions a {
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            transition: color var(--transition);
        }

        .mobile-actions a:hover { color: var(--accent); }

        .mobile-actions svg { width: 18px; height: 18px; }

        /* ============================================
           States
           ============================================ */
        .state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--muted);
        }

        .state.error { color: #c53030; }

        /* ============================================
           Footer
           ============================================ */
        .site-footer {
            border-top: 1px solid var(--border);
            background: var(--surface);
            padding: 1.5rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .site-footer .meta {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        /* ============================================
           Mobile (overlay fallback)
           ============================================ */
        @media (hover: none) {
            .project-image .overlay { display: none; }
            .mobile-actions { display: flex; }
        }

        @media (hover: hover) {
            .mobile-actions { display: none; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <a href="../" class="avatar" aria-label="Back to blog"></a>
    <nav>
        <a href="../" class="nav-link" rel="noopener">← Blog</a>
    </nav>
</header>

<main>

    <section class="hero">
        <h1><span class="accent">E</span>xtra</h1>
        <p class="subtitle">一些写过、玩过、折腾过的小项目</p>
        <p class="meta">Projects · Experiments · Playground</p>
    </section>

    <section id="app" class="projects">
        <div v-cloak>
            <div v-if="loading" class="state">Loading…</div>
            <div v-else-if="error" class="state error">{{ error }}</div>
            <div v-else class="grid">
                <article v-for="ls in sortedLists" :key="ls.name" class="project-card">
                    <span v-if="ls.pinned" class="project-badge">📌 置顶</span>
                    <div class="project-image">
                        <img :src="ls.img" :alt="ls.name" loading="lazy">
                        <div v-if="ls.githubLink || ls.downloadLink" class="overlay">
                            <a v-if="ls.githubLink" :href="ls.githubLink" target="_blank" rel="noopener noreferrer" class="overlay-btn">
                                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1-.01-1.96-3.2.7-3.88-1.54-3.88-1.54-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.34.95.1-.74.4-1.24.73-1.53-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.41-5.27 5.69.41.36.78 1.07.78 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.68.8.56C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
                                GitHub
                            </a>
                            <a v-if="hasDownload(ls)" :href="ls.downloadLink" target="_blank" rel="noopener noreferrer" class="overlay-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                Download
                            </a>
                        </div>
                    </div>
                    <div class="project-body">
                        <h3 class="project-title">
                            <a :href="ls.url || '#'" target="_blank" rel="noopener noreferrer">{{ ls.name }}</a>
                        </h3>
                        <ul v-if="ls.tags && ls.tags.length" class="project-tags">
                            <li v-for="t in ls.tags" :key="t">{{ t }}</li>
                        </ul>
                        <p class="project-desc" :title="ls.des">{{ ls.des }}</p>
                        <div class="project-actions">
                            <a v-if="ls.url" :href="ls.url" target="_blank" rel="noopener noreferrer" class="demo-link">
                                Live Demo
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="14" height="14"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
                            </a>
                            <div class="mobile-actions">
                                <a v-if="ls.githubLink" :href="ls.githubLink" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1-.01-1.96-3.2.7-3.88-1.54-3.88-1.54-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.34.95.1-.74.4-1.24.73-1.53-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.41-5.27 5.69.41.36.78 1.07.78 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.68.8.56C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
                                </a>
                                <a v-if="hasDownload(ls)" :href="ls.downloadLink" target="_blank" rel="noopener noreferrer" aria-label="Download">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </section>

</main>

<footer class="site-footer">
    <div>© <span id="year"></span> · Extra</div>
    <div class="meta">Projects · Experiments · Playground</div>
</footer>

<script>
    Vue.config.productionTip = false;
    new Vue({
        el: '#app',
        data: {
            lists: { lists: [] },
            loading: true,
            error: null
        },
        computed: {
            sortedLists: function () {
                if (!this.lists.lists) return [];
                return this.lists.lists.slice().sort(function (a, b) {
                    return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
                });
            }
        },
        mounted: function () {
            var self = this;
            fetch('/data/lists.json', { cache: 'no-store' })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (data) {
                    self.lists = data;
                })
                .catch(function (e) {
                    self.error = '加载失败：' + e.message;
                })
                .finally(function () {
                    self.loading = false;
                });
        },
        methods: {
            hasDownload: function (item) {
                if (!item.downloadLink) return false;
                var v = String(item.downloadLink).trim();
                return v.length > 0 && v !== '#' && v !== 'javascript:;';
            }
        }
    });

    document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
