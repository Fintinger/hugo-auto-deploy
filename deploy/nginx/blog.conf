# Archai 技术小站 · 线上 nginx 站点配置（仓库内副本，与服务器保持一致）
#
# 服务器路径：/etc/nginx/sites-available/blog（软链到 sites-enabled/blog）
# 事实来源：服务器上的实际配置；改动请两边同步，并在服务器上 `nginx -t && systemctl reload nginx`。
# /admin 的安全头位于 /etc/nginx/snippets/blog-admin-headers.conf，由本目录的
# blog-admin-headers.conf 提供（仓库内为同一份文件）。
#
# 变更记录：
#   2026-10-20 建站迁至阿里云 ECS（nginx 静态托管 + Let's Encrypt）
#   2026-10-27 新增 location ^~ /admin/，安全头由 vercel.json 迁移至 nginx snippet
#   2026-10-28 新增自定义 404（error_page 404 /404.html）
server {
    listen 80;
    listen [::]:80;
    server_name archai.space www.archai.space blog.archai.space;

    # ACME 续期验证必须留在 80 端口
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blog;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name archai.space www.archai.space blog.archai.space;

    ssl_certificate     /etc/letsencrypt/live/archai.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archai.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/blog;
    index index.html;
    charset utf-8;

    # 自定义 404 页（Hugo 生成 public/404.html）
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # /admin 专属安全头（CSP / X-Frame-Options / X-Robots-Tag 等）
    # ^~ 前缀优先于下方静态文件正则，/admin/ 下的 css/js 同样带上这些头
    # 注意：location 内的 add_header 会覆盖 server 级继承，故 snippet 内完整重声明了 HSTS 等头
    location ^~ /admin/ {
        include /etc/nginx/snippets/blog-admin-headers.conf;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|webp|svg|ico|gif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;
}
