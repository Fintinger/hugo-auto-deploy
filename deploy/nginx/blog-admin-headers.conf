# /admin 专属 HTTP 响应头（原 vercel.json 的 headers 规则迁移而来）
#
# 服务器位置：/etc/nginx/snippets/blog-admin-headers.conf
# 引入位置：/etc/nginx/sites-available/blog 的 location ^~ /admin/ 中
#          include /etc/nginx/snippets/blog-admin-headers.conf;
#
# 注意：
#   1. nginx 的 add_header 一旦出现在 location 内，就会覆盖从 server 继承来的全部 add_header，
#      所以本文件必须完整重声明 HSTS / X-Content-Type-Options / Referrer-Policy，不能只写 /admin 专属的那几个。
#   2. 本文件是 /admin 安全头的唯一事实来源；static/admin/index.html 里的 <meta> CSP 只作兜底，两者需保持一致。
#   3. 修改后必须：nginx -t && systemctl reload nginx；然后用 curl -I 核对响应头。
#
# 变更记录：2026-10-27 由 vercel.json 迁移至 nginx（站点已于 2026-10-20 迁到阿里云 ECS，Vercel 不再承载流量）。

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https:; font-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none';" always;
